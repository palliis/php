name: Publish PHP FPM Trixie

on:
  push:
    branches: [codex/fpm-trixie]
    paths:
      - '8.3/trixie/fpm/**'
      - '8.4/trixie/fpm/**'
      - '8.5/trixie/fpm/**'
      - '.github/workflows/publish-fpm-trixie.yml'
  pull_request:
    branches: [codex/fpm-trixie]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-fpm-trixie-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/palliis/php

jobs:
  build:
    name: PHP ${{ matrix.php.version }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php:
          - {series: '8.3', version: '8.3.36'}
          - {series: '8.4', version: '8.4.27'}
          - {series: '8.5', version: '8.5.12'}
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.repository == 'palliis/php' && github.ref == 'refs/heads/codex/fpm-trixie'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.php.series }}/trixie/fpm
          platforms: linux/${{ matrix.platform.arch }}
          pull: true
          labels: |
            org.opencontainers.image.source=https://github.com/palliis/php
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.php.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && github.repository == 'palliis/php' && github.ref == 'refs/heads/codex/fpm-trixie' }}
          provenance: mode=min
          cache-from: type=gha,scope=fpm-trixie-${{ matrix.php.series }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=fpm-trixie-${{ matrix.php.series }}-${{ matrix.platform.arch }}
      - name: Export image digest
        if: github.event_name != 'pull_request' && github.repository == 'palliis/php' && github.ref == 'refs/heads/codex/fpm-trixie'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        if: github.event_name != 'pull_request' && github.repository == 'palliis/php' && github.ref == 'refs/heads/codex/fpm-trixie'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.php.version }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tag PHP ${{ matrix.version }}
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'palliis/php' && github.ref == 'refs/heads/codex/fpm-trixie'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ['8.3.36', '8.4.27', '8.5.12']
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.version }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify full-version multi-platform tag
        working-directory: ${{ runner.temp }}/digests
        env:
          PHP_VERSION: ${{ matrix.version }}
        run: |
          shopt -s nullglob
          digests=(*)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          tag="$IMAGE:$PHP_VERSION-fpm-trixie"
          docker buildx imagetools create --tag "$tag" "${sources[@]}"
          docker buildx imagetools inspect "$tag"
          docker buildx imagetools inspect "$tag" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          printf 'Published `%s` for linux/amd64 and linux/arm64.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
